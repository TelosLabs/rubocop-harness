Harness:
  Enabled: true

Harness/ControllerMethodLength:
  Description: >-
    Enforces a maximum method length in controllers. Extract long methods
    into service objects.
  Enabled: true
  Severity: warning
  VersionAdded: '0.1'
  Max: 10
  AllowedMethods: []
  Include:
    - '**/app/controllers/**/*.rb'
  Exclude:
    - '**/app/controllers/concerns/**/*.rb'

Harness/ModelMethodLength:
  Description: >-
    Enforces a maximum method length in models. Long methods should be
    decomposed into smaller methods, concerns, or value objects.
  Enabled: true
  Severity: warning
  VersionAdded: '0.1'
  Max: 7
  AllowedMethods: []
  Include:
    - '**/app/models/**/*.rb'
  Exclude:
    - '**/app/models/concerns/**/*.rb'

Harness/RestfulActions:
  Description: >-
    Controllers should only define the 7 RESTful actions. Extract
    non-standard actions into new controllers.
  Enabled: true
  Severity: warning
  VersionAdded: '0.1'
  AllowedMethods: []
  Include:
    - '**/app/controllers/**/*.rb'
  Exclude:
    - '**/app/controllers/concerns/**/*.rb'

Harness/ServiceInterface:
  Description: >-
    Service objects must define a `call` or `save` instance method.
  Enabled: true
  Severity: warning
  VersionAdded: '0.1'
  RequiredMethods:
    - call
    - save
  Include:
    - '**/app/services/**/*.rb'
  Exclude:
    - '**/app/services/application_service.rb'

Harness/NoQueriesInControllers:
  Description: >-
    Controllers should not contain ActiveRecord query methods. Move
    queries to service objects or model scopes.
  Enabled: true
  Severity: warning
  VersionAdded: '0.1'
  AllowedMethods:
    - find
    - find_by
  Include:
    - '**/app/controllers/**/*.rb'
  Exclude:
    - '**/app/controllers/concerns/**/*.rb'

Harness/JobMethodLength:
  Description: >-
    Enforces a maximum method length in jobs. Jobs should be thin and
    delegate to service objects.
  Enabled: true
  Severity: warning
  VersionAdded: '0.3'
  Max: 7
  AllowedMethods: []
  Include:
    - '**/app/jobs/**/*.rb'
  Exclude:
    - '**/app/jobs/application_job.rb'

Harness/NoPresentationInModels:
  Description: >-
    Models should not contain presentation logic. Move HTML generation,
    route helpers, and view-layer methods to presenters or view helpers.
  Enabled: true
  Severity: warning
  VersionAdded: '0.3'
  AllowedMethods: []
  Include:
    - '**/app/models/**/*.rb'
  Exclude:
    - '**/app/models/concerns/**/*.rb'

Harness/NoBareRescue:
  Description: >-
    Blanket rescues (class-less `rescue`, `rescue => e`, or explicit
    `rescue StandardError`/`Exception`) hide the specific failure that
    should be handled. Rescue a specific error class. A blanket rescue is
    allowed only as a backstop after a specific rescue clause.
  Enabled: true
  Severity: warning
  VersionAdded: '0.4'
  Include:
    - '**/app/**/*.rb'
    - '**/lib/**/*.rb'
